
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Fantasy Football · Partyraum</title>

<style>
:root {
  --bg: #090d15;
  --panel: #131a27;
  --panel2: #192235;
  --line: #29354a;
  --muted: #a8b4c8;
  --text: #f4f7fc;
  --accent: #a7f36b;
  --blue: #79b8ff;
  --gold: #ffd36a;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

body {
  height: 100vh;
  height: 100dvh;
  padding: 18px 24px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: radial-gradient(
    ellipse at 50% -20%,
    #263957 0%,
    var(--bg) 60%
  );
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin: 0 auto 14px;
  width: 100%;
  max-width: 1800px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
  flex-shrink: 0;
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: .18em;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
}

h1 {
  font-size: clamp(28px, 3vw, 46px);
  line-height: 1;
  margin: 7px 0 0;
  letter-spacing: -.04em;
}

.sub {
  color: var(--muted);
  font-size: 15px;
  margin-top: 8px;
}

.right {
  text-align: right;
  white-space: nowrap;
}

.week {
  font-size: 25px;
  font-weight: 800;
}

.updated {
  font-size: 13px;
  color: var(--muted);
  margin-top: 6px;
}

main {
  width: 100%;
  max-width: 1800px;
  margin: 0 auto;
  flex: 1;
  min-height: 0;
}

.grid {
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.match {
  background: linear-gradient(
    145deg,
    var(--panel2),
    var(--panel)
  );
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 18px;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.matchhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .1em;
  font-weight: 700;
}

.live {
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

.teamrow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
}

.teamrow + .teamrow {
  border-top: 1px solid var(--line);
}

.teamname {
  font-size: clamp(16px, 1.35vw, 24px);
  font-weight: 800;
  overflow-wrap: anywhere;
}

.score {
  font-size: clamp(24px, 2.3vw, 36px);
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.04em;
}

.winner .score {
  color: var(--accent);
}

.versus {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 10px;
  margin: 2px 0;
}

.versus:before,
.versus:after {
  content: "";
  height: 1px;
  background: var(--line);
  flex: 1;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 24px 16px;
  color: var(--muted);
  font-size: 20px;
}

footer {
  width: 100%;
  max-width: 1800px;
  margin: 10px auto 0;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: #73819a;
  font-size: 11px;
  flex-shrink: 0;
}

.error {
  color: #ff9c9c;
}

.hidden {
  display: none;
}

/* Kompaktere Darstellung bei niedrigen Bildschirmen */
@media (max-height: 700px) {
  body {
    padding: 10px 18px;
  }

  header {
    margin-bottom: 8px;
    padding-bottom: 8px;
  }

  h1 {
    font-size: clamp(24px, 2.5vw, 36px);
  }

  .sub {
    margin-top: 5px;
    font-size: 12px;
  }

  .match {
    padding: 8px 12px;
  }

  .matchhead {
    margin-bottom: 5px;
    font-size: 10px;
  }

  .teamrow {
    padding: 5px 0;
  }

  .teamname {
    font-size: clamp(14px, 1.2vw, 20px);
  }

  .score {
    font-size: clamp(20px, 2vw, 30px);
  }

  footer {
    margin-top: 6px;
  }
}

/* Schmale Bildschirme */
@media (max-width: 700px) {
  body {
    padding: 12px;
    overflow: auto;
    height: auto;
    min-height: 100vh;
  }

  header {
    align-items: flex-start;
    gap: 10px;
  }

  h1 {
    font-size: 26px;
  }

  .eyebrow {
    font-size: 10px;
  }

  .sub {
    font-size: 12px;
  }

  .week {
    font-size: 18px;
  }

  .updated {
    font-size: 10px;
  }

  .grid {
    height: auto;
    grid-template-columns: 1fr;
    grid-template-rows: auto;
  }

  .match {
    min-height: 150px;
  }

  .teamname {
    font-size: 20px;
  }

  .score {
    font-size: 30px;
  }

  footer {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <div class="eyebrow">Sleeper · Fantasy Football</div>
    <h1>LEAGUE MATCHUPS</h1>
    <div class="sub" id="leagueName">
      Punkte live aus eurer Liga
    </div>
  </div>

  <div class="right">
    <div class="week" id="weekLabel">WEEK —</div>
    <div class="updated" id="updated">Verbinde mit Sleeper …</div>
  </div>
</header>

<main>
  <div class="grid" id="matchups">
    <div class="empty">Lade aktuelle Punktestände …</div>
  </div>
</main>

<footer>
  <span id="status">Datenquelle: Sleeper API</span>
  <span>Automatische Aktualisierung alle 45 Sekunden</span>
</footer>

<script>
(() => {
  const LEAGUE_ID = '1309297618647547904';
  const API = 'https://api.sleeper.app/v1';
  const REFRESH_MS = 45000;

  const $ = id => document.getElementById(id);

  const fmt = n =>
    Number(n || 0).toLocaleString('de-DE', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  async function get(path) {
    const r = await fetch(API + path, {
      cache: 'no-store'
    });

    if (!r.ok) {
      throw new Error(
        'Sleeper API antwortet mit ' + r.status
      );
    }

    return r.json();
  }

  function managerName(user) {
    return user?.metadata?.team_name
      || user?.display_name
      || user?.username
      || 'Team';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));
  }

  function render(matches, names, week, league) {
    $('leagueName').textContent =
      league?.name || 'Eure Fantasy Football Liga';

    $('weekLabel').textContent = 'WEEK ' + week;

    const byMatch = new Map();

    for (const m of matches) {
      if (m.matchup_id == null) continue;

      if (!byMatch.has(m.matchup_id)) {
        byMatch.set(m.matchup_id, []);
      }

      byMatch.get(m.matchup_id).push(m);
    }

    // Alle vollständigen Matchups anzeigen,
    // auch wenn beide Teams noch 0 Punkte haben.
const games = [...byMatch.values()].filter(pair=>pair.length===2);
    );

    games.sort((a, b) =>
      Math.min(...a.map(t => t.roster_id))
      - Math.min(...b.map(t => t.roster_id))
    );

    if (!games.length) {
      $('matchups').innerHTML =
        '<div class="empty">Für Week ' + week +
        ' wurden noch keine Matchups gefunden.' +
        '<br><small>Diese Anzeige aktualisiert sich automatisch.</small></div>';
      return;
    }

    $('matchups').innerHTML = games.map((pair, i) => {
      pair.sort((a, b) =>
        Number(b.custom_points ?? b.points ?? 0)
        - Number(a.custom_points ?? a.points ?? 0)
      );

      const [a, b] = pair;

      const ap = Number(a.custom_points ?? a.points ?? 0);
      const bp = Number(b.custom_points ?? b.points ?? 0);

      const started = ap > 0 || bp > 0;
      const aWin = ap > bp;
      const bWin = bp > ap;

      return `
        <article class="match">
          <div class="matchhead">
            <span>Matchup ${String(i + 1).padStart(2, '0')}</span>
            <span class="live">
              <i class="dot"></i>
              ${started ? 'PUNKTESTAND' : 'AUSSTEHEND'}
            </span>
          </div>

          <div class="teamrow ${aWin ? 'winner' : ''}">
            <div class="teamname">
              ${esc(names[a.roster_id] || 'Team ' + a.roster_id)}
            </div>
            <div class="score">${fmt(ap)}</div>
          </div>

          <div class="versus">VS</div>

          <div class="teamrow ${bWin ? 'winner' : ''}">
            <div class="teamname">
              ${esc(names[b.roster_id] || 'Team ' + b.roster_id)}
            </div>
            <div class="score">${fmt(bp)}</div>
          </div>
        </article>
      `;
    }).join('');
  }

  async function refresh() {
    try {
      const [league, state, users, rosters] =
        await Promise.all([
          get('/league/' + LEAGUE_ID),
          get('/state/nfl'),
          get('/league/' + LEAGUE_ID + '/users'),
          get('/league/' + LEAGUE_ID + '/rosters')
        ]);

      if (!league) {
        throw new Error('Liga nicht gefunden.');
      }

      const week = Number(
        state.display_week || state.week || 1
      );

      const matches = await get(
        '/league/' + LEAGUE_ID + '/matchups/' + week
      );

      const userById = Object.fromEntries(
        users.map(u => [u.user_id, u])
      );

      const names = {};

      for (const roster of rosters) {
        const u = userById[roster.owner_id];

        names[roster.roster_id] = managerName(u);
      }

      render(
        Array.isArray(matches) ? matches : [],
        names,
        week,
        league
      );

      $('updated').textContent =
        'Aktualisiert: ' +
        new Date().toLocaleTimeString('de-DE', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });

      $('status').textContent =
        'Verbunden · Aktualisierung alle 45 Sekunden';

      $('status').classList.remove('error');

    } catch (e) {
      $('updated').textContent = 'Verbindung fehlgeschlagen';

      $('status').textContent =
        e.message + ' · Bitte Internetverbindung prüfen.';

      $('status').classList.add('error');

      $('matchups').innerHTML =
        '<div class="empty">Sleeper-Daten konnten nicht geladen werden.' +
        '<br><small>Bitte Internetverbindung prüfen und Seite neu laden.</small></div>';
    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
})();
</script>

</body>
</html>
