<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Schulzes Special Team · Trinkhalle</title>
<!-- Deployment refresh: 2026-10-26 -->
<style>
:root{--bg:#080f0b;--panel:#101b14;--panel2:#17261c;--line:#2d4935;--muted:#b0c1b4;--text:#f4f8f4;--accent:#a7f36b;--blue:#c2d7c7;--gold:#ffd36a}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:0;margin:0;padding:0;overflow:hidden;background:#000;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{position:relative;display:block}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;box-sizing:border-box;transform-origin:top left;overflow:hidden;display:flex;flex-direction:column;padding:12px;background-color:#6f3d2b;background-image:linear-gradient(335deg,rgba(30,12,7,.25),transparent 45%),repeating-linear-gradient(0deg,transparent 0 47px,rgba(28,13,8,.85) 47px 53px),repeating-linear-gradient(90deg,#9b5b40 0 118px,#5c2e21 118px 126px,#b16c4c 126px 244px,#5c2e21 244px 252px);background-size:auto,auto,252px 106px;background-position:0 0,0 0,0 0}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 8px;width:100%;max-width:none;border-bottom:2px solid #3d241a;padding-bottom:6px;flex-shrink:0;background:rgba(24,14,10,.78);padding:8px 10px;border-radius:8px}

.brandline{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
  flex:1;
  white-space:nowrap;
}
.brand-copy{display:flex;align-items:baseline;gap:14px;min-width:0;white-space:nowrap}
.brandline .franchise-logo,.brandline .trinkhalle-logo{width:54px;height:54px;object-fit:contain;flex:0 0 auto;border-radius:10px;background:#f4f8f4;padding:4px;border:1px solid #42654a}
.brandline .eyebrow{
  letter-spacing:.12em;
  flex-shrink:0;
}
.brandline h1{
  font-size:28px;
  line-height:1;
  margin:0;
  white-space:nowrap;
  flex-shrink:0;
}
.brandline .sub{
  margin:0;
  white-space:nowrap;
  flex-shrink:0;
}

.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:11px;font-weight:700;color:var(--accent)}
h1{font-size:28px;line-height:1;margin:5px 0 0;letter-spacing:-.04em}
.sub{color:var(--muted);font-size:12px;margin-top:5px}
.right{text-align:right;flex-shrink:0}
.week{font-size:18px;font-weight:800}
.updated{font-size:10px;color:var(--muted);margin-top:4px}

main{width:100%;max-width:none;margin:0;flex:1 1 auto;min-height:0}
.grid{height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));grid-auto-rows:auto;align-items:stretch;gap:8px}

.match,.scoreboard{height:100%;min-height:0;background:#f0e4c8;color:#292018;border:1px solid #c9b58e;border-radius:3px;padding:8px;box-shadow:3px 5px 7px #0006;min-width:0;position:relative}
.match{display:flex;flex-direction:column;overflow:hidden;transform:rotate(-.25deg)}
.match:nth-child(2n){transform:rotate(.35deg)}
.match:before,.scoreboard:before{content:"";position:absolute;top:7px;left:50%;width:10px;height:10px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#f5d9a2 0 18%,#9a2920 25% 60%,#5b1712 75%);box-shadow:0 2px 2px #0006;z-index:2}
.matchhead,.panelhead{color:#5c4937}
.teamname{color:#292018}
.teamstats{border-top-color:#c8b999;color:#655443}
.teamstats strong,.winchance strong,.starter-points strong{color:#245b32}
.versus:before,.versus:after,.ticker-sep{background:#bca987}
.starter-table{border-top-color:#c8b999}
.starter-row{border-top-color:#d8c8a8}
.starter-head,.starter-slot,.starter-projection{color:#66513d}
.scoreboard .event-meta,.scoreboard .no-events,.scoreboard .event-total{color:#655443}
.score-event{background:#e5d6b6;border-color:#c8b999}
.event-name{color:#292018}
.event-delta{color:#245b32}
.matchhead,.panelhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.live{color:var(--accent);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:var(--accent);box-shadow:0 0 12px #a7f36b88}
.teamrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:5px 0}
.teamlabel{display:flex;align-items:center;gap:7px;min-width:0}
.teamlogo{width:38px;height:38px;object-fit:contain;flex:0 0 auto;border-radius:8px;background:#0c121e;border:1px solid #29354a;padding:2px}
.teamname{font-size:15px;font-weight:800;overflow-wrap:anywhere}
.score{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.winner .score{color:var(--accent)}
.versus{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:10px;margin:1px 0}
.versus:before,.versus:after{content:"";height:1px;background:var(--line);flex:1}
.teamstats{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;padding:3px 0;color:var(--muted);font-size:9px;border-top:1px solid #29354a88}
.teamstats strong{color:var(--text);font-size:13px;font-variant-numeric:tabular-nums}
.winchance strong{color:var(--accent)}
.subnote{font-size:9px;color:var(--muted);margin-top:2px}
.empty{grid-column:1/-1;text-align:center;padding:20px 10px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.scoreboard{grid-column:auto;grid-row:auto;min-width:0;display:flex;flex-direction:column}
.score-subtitle{color:var(--muted);font-size:10px;margin:-4px 0 10px}
.scoring-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;min-width:0}
.score-event{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px;background:#0c121e;border:1px solid var(--line);border-radius:8px;min-width:0}
.event-name{font-weight:700;font-size:11px;overflow-wrap:anywhere}
.event-meta,.no-events{color:var(--muted);font-size:10px;margin-top:3px}
.event-points{text-align:right;white-space:nowrap}
.event-delta{font-weight:800;color:var(--accent);font-size:12px}
.event-total{font-size:9px;color:var(--muted);margin-top:3px}
.nfl-ticker{width:100%;max-width:none;margin:8px 0 0;overflow:hidden;border:1px solid #3d241a;border-radius:5px;background:rgba(24,14,10,.92);display:flex;align-items:center;min-height:36px;flex-shrink:0}
.ticker-label{flex:0 0 auto;padding:0 12px;color:var(--accent);font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center}
.ticker-viewport{overflow:hidden;flex:1;white-space:nowrap}
.ticker-track{display:inline-flex;align-items:center;gap:24px;min-width:max-content;padding:8px 16px;animation:ticker-scroll 55s linear infinite}
.nfl-ticker:hover .ticker-track{animation-play-state:paused}
.ticker-game{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--text)}
.ticker-game .ticker-status{font-size:9px;color:var(--muted);text-transform:uppercase}
.ticker-game .ticker-score{font-weight:800;font-variant-numeric:tabular-nums}
.ticker-sep{color:var(--line)}
@keyframes ticker-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-empty{padding:8px 12px;color:var(--muted);font-size:11px}
footer{width:100%;max-width:none;margin:6px 0 0;display:flex;justify-content:space-between;gap:12px;color:#f2dfc8;font-size:10px;flex-shrink:0;text-shadow:0 1px 2px #000}
.error{color:#ff9c9c}
.projection-debug{margin-top:4px;font-size:10px;color:var(--muted)}
.projection-debug summary{cursor:pointer}
.debug-table-wrap{max-height:180px;overflow:auto}
.debug-table-wrap table{border-collapse:collapse;width:100%;font-size:10px}
.debug-table-wrap th,.debug-table-wrap td{padding:2px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.debug-table-wrap th:first-child,.debug-table-wrap td:first-child{text-align:left}
.debug-table-wrap p{margin:4px 0}

/* Spieler unter den Matchups: beide Teams nebeneinander */
.match-teams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;min-width:0}
.match-side{min-width:0;overflow:hidden}
.match-side .teamrow{grid-template-columns:minmax(0,1fr);gap:2px;padding:3px 0}
.match-side .teamlabel{gap:4px}
.match-side .teamlogo{width:22px;height:22px}
.match-side .teamname{font-size:11px;line-height:1.15}
.match-side .score{font-size:20px}
.match-side .teamstats{display:block;font-size:9px}
.match-side .teamstats>span{display:block}
.match-side .projection-debug,.match-side .missing-note{display:none}
.match-side .subnote{display:none}
.starter-table{margin-top:6px;border-top:1px solid var(--line);min-width:0}
.starter-head,.starter-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.starter-head{padding:4px 0;color:var(--muted);font-size:8px;text-transform:uppercase}
.starter-row{padding:3px 0;border-top:1px solid #29354a55;font-size:9px;line-height:1.2}
.starter-player{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:3px;align-items:center;min-width:0}
.starter-slot{color:var(--blue);font-size:8px;overflow:hidden}
.starter-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.starter-points{white-space:nowrap;font-variant-numeric:tabular-nums}
.starter-points strong{color:var(--accent);font-size:9px}
.starter-projection{color:var(--muted);font-size:8px}
</style>
</head>

<body>
<div id="stage">

<header>
  <div class="brandline">
    <img class="franchise-logo" src="https://sleepercdn.com/uploads/17764319936c3a860704b73b61056ade.jpg" alt="Schulzes Special Team Logo">
    <img class="trinkhalle-logo" src="https://raw.githubusercontent.com/CWellegehausen/fantasy-party-display/main/Logo%20Trinkhalle.png" alt="Trinkhalle Logo">
    <div class="brand-copy"><span class="eyebrow">SCHULZES SPECIAL TEAM · TRINKHALLE</span><h1>GAME DAY</h1><span class="sub" id="leagueName">OFF-LIGA</span></div>
  </div>
  <div class="right">
    <div class="week" id="weekLabel">WEEK —</div>
    <div class="updated" id="updated">Verbinde mit Sleeper …</div>
  </div>
</header>

<main>
  <div class="grid" id="matchups">
    <div class="empty">Lade aktuelle Punktestände und Projektionen …</div>
  </div>
</main>

<div class="nfl-ticker" aria-label="NFL-Spielstände">
  <div class="ticker-label">NFL LIVE</div>
  <div class="ticker-viewport" id="nflTicker">
    <div class="ticker-empty">NFL-Spielstände werden geladen …</div>
  </div>
</div>

<footer>
  <span id="status">Datenquelle: Sleeper API</span>
  <span>Automatische Aktualisierung alle 5 Sekunden</span>
</footer>

</div>

<script>
(() => {
'use strict';

const LEAGUE_ID='1309297618647547904';
const API='https://api.sleeper.app/v1';
const PROJECTION_API='https://api.sleeper.app/v1';
const REFRESH_MS=5000;
const MAX_EVENTS=10;
const EVENT_LIFETIME_MS=3*60*1000;

const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString('de-DE',{
  minimumFractionDigits:2,
  maximumFractionDigits:2
});

let projectionMap=Object.create(null);
let projectionMetaMap=Object.create(null);
let projectionMessage='Projektionen noch nicht geladen';
let playerDirectoryCache=null;
let nflTeamGameStates=Object.create(null);
let projectionKey='';
let playerDirectoryPromise=null;
let previousPlayerPoints=null;
let lastWeek=null;
let scoringEvents=[];
let refreshing=false;
let nflTickerTimer=null;

async function getUrl(url){
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw new Error('API antwortet mit HTTP '+response.status);
  return response.json();
}

async function get(path){
  return getUrl(API+path);
}

function esc(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function managerName(user){
  return user?.metadata?.team_name||
    user?.display_name||
    user?.username||
    'Team';
}

function getPoints(team){
  const value=Number(team?.custom_points??team?.points??0);
  return Number.isFinite(value)?value:0;
}

function scoringMode(league){
  const scoring=league?.scoring_settings||{};
  const reception=Number(scoring.rec??scoring.rec_pts??0);
  if(reception>=0.99)return'ppr';
  if(reception>=0.49)return'half';
  return'standard';
}

async function loadProjections(season,week,seasonType){
  const type=seasonType||'regular';
  const key=`${season}-${week}-${type}`;

  if(key===projectionKey&&Object.keys(projectionMap).length)return;

  projectionKey=key;
  projectionMap=Object.create(null);
  projectionMessage='Projektionen werden geladen …';

  const url=`${PROJECTION_API}/projections/nfl/${type}/${season}/${week}`;

  try{
    const data=await getUrl(url);

    const rows=Array.isArray(data)
      ?data.map(item=>[
        String(item?.player_id??item?.player?.player_id??''),
        item
      ])
      :Object.entries(data||{}).map(([key,item])=>[
        String(item?.player_id??item?.player?.player_id??key),
        item
      ]);

    const next=Object.create(null);

    for(const[rowId,item]of rows){
      if(!item)continue;
      const id=rowId;
      if(!id)continue;

      const stats=item.stats??item.projection??item;

      if(stats&&typeof stats==='object'){
        next[id]=stats;
      }
    }

    projectionMap=next;
    projectionMetaMap=Object.create(null);

    const count=Object.keys(next).length;
    projectionMessage=count
      ?`Projektionen geladen (${count} Spieler)`
      :'Keine Punkteprojektionen gefunden';

    console.info(
      'Sleeper-Projektionen:',
      count,
      'Spieler; Saison:',
      season,
      'Woche:',
      week
    );
  }catch(error){
    console.error('Projektionen konnten nicht geladen werden:',error);
    projectionMessage='Projektionen konnten nicht geladen werden';
  }
}

function getProjection(playerId,league){
  const stats=projectionMap[String(playerId)];
  if(!stats)return null;

  const scoring=league?.scoring_settings||{};
  const weighted=Object.entries(scoring).filter(
    ([key])=>typeof stats[key]==='number'
  );

  if(weighted.length){
    const total=weighted.reduce(
      (sum,[key,value])=>sum+stats[key]*value,
      0
    );
    return Number.isFinite(total)?total:null;
  }

  const fallback=stats.pts_ppr;
  return typeof fallback==='number'&&Number.isFinite(fallback)
    ?fallback
    :null;
}

function projectedTeamTotal(team,league){
  const actual=team?.players_points||{};
  const starters=(team?.starters||[]).filter(
    id=>id!==null&&id!==undefined&&id!==''&&id!=='0'
  );

  let total=0,found=0,missing=0;
  const missingPlayers=[],details=[];

  for(const id of starters){
    const projection=getProjection(id,league);
    const name=playerDirectoryCache?.[String(id)]?.name||String(id);
    const rawScored=Number(actual[id]??0);
    const scored=Number.isFinite(rawScored)?rawScored:0;

    if(projection===null||!Number.isFinite(projection)){
      missing++;
      missingPlayers.push(name);
      details.push({
        name,id,projection:null,actual:scored,contribution:null
      });
      continue;
    }

    const nflTeam=playerDirectoryCache?.[String(id)]?.team;
    const gameState=nflTeamGameStates[String(nflTeam||'').toUpperCase()];

    const contribution=gameState==='completed'
      ?scored
      :Math.max(projection,scored);

    total+=contribution;
    found++;

    details.push({
      name,id,projection,actual:scored,contribution
    });
  }

  return{
    total:missing===0&&found>0?total:null,
    found,
    missing,
    missingPlayers,
    starterCount:starters.length,
    details
  };
}

function projectionDebugHtml(result){
  const rows=result.details.map(p=>`
    <tr>
      <td>${esc(p.name)}</td>
      <td>${esc(p.id)}</td>
      <td>${p.projection===null?'FEHLT':fmt(p.projection)}</td>
      <td>${fmt(p.actual)}</td>
      <td>${p.contribution===null?'—':fmt(p.contribution)}</td>
    </tr>
  `).join('');

  return `<details class="projection-debug">
    <summary>Prognose prüfen · Einzelspieler</summary>
    <div class="debug-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Spieler</th>
            <th>ID</th>
            <th>Prognose</th>
            <th>Ist-Punkte</th>
            <th>Beitrag</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <p>Summe intern: ${result.total===null?'unvollständig':fmt(result.total)}
      · ${result.found}/${result.starterCount} Starter</p>
    </div>
  </details>`;
}

function estimatedWinChance(a,b){
  return 100/(1+Math.exp(-(a-b)/12));
}

/* Prognose und Siegchance ohne die beiden zusätzlichen Beschriftungen */
function statsHtml(team,opponent,league){
  const a=projectedTeamTotal(team,league);
  const b=projectedTeamTotal(opponent,league);

  const complete=a.total!==null&&b.total!==null;
  const chance=complete
    ?Math.round(estimatedWinChance(a.total,b.total))
    :null;

  return `<div class="teamstats">
    <span>
      Prognose <strong>${a.total===null?'—':fmt(a.total)}</strong>
      ${a.missing
        ?'<div class="subnote">Prognose unvollständig</div>'
        :''}
    </span>
    <span class="winchance">
      Siegchance <strong>${chance===null?'—':chance+' %'}</strong>
    </span>
  </div>`;
}

const TEAM_LOGOS={
  'schulzes special team':'https://sleepercdn.com/uploads/17764319936c3a860704b73b61056ade.jpg',
  'saltcity reapers':'https://sleepercdn.com/avatars/720818e7b3d31a7f675c975b9f8acabd',
  'othfresen calling':'https://sleepercdn.com/avatars/eaa164fa102911e255f3c92b8a965cf4',
  'rudis raptors':'raptors.jpg',
  'the mightybear':'https://sleepercdn.com/avatars/b232c62dc41d911d5c41d727f5c4c3ee',
  'running peter':'https://sleepercdn.com/avatars/b2d03686b20a347bf6777a8b138684a0',
  'nightflyers':'https://sleepercdn.com/uploads/078c946f0fbd579454dad5f503316011.jpg',
  'king cobras':'https://sleepercdn.com/uploads/ec71e53e5e5d9ea827e35de1ddbf876f',
  'maxpower':'https://sleepercdn.com/avatars/527d79b08cd88531d9899f7b10166711',
  'peace pipe':'https://sleepercdn.com/avatars/a837d884740018795dcc751d0edb6232'
};

function teamLabelHtml(name){
  const normalized=String(name||'').trim().toLowerCase().replace(/\s+/g,' ');
  return `<div class="teamlabel">
    <div class="teamname">${esc(name)}</div>
  </div>`;
}

/* Zeigt die aufgestellten Spieler beider Teams nebeneinander */
function matchupPlayersHtml(a,b,league){
  const startersA=Array.isArray(a.starters)?a.starters:[];
  const startersB=Array.isArray(b.starters)?b.starters:[];
  const slots=Array.isArray(league?.roster_positions)
    ?league.roster_positions
    :[];

  function playerHtml(team,id,index){
    if(!id||id==='0'){
      return `<div class="starter-player">
        <span class="starter-slot">—</span>
        <span class="starter-name">Leer</span>
        <span></span>
      </div>`;
    }

    const player=playerDirectoryCache?.[String(id)];
    const name=player?.name||`Spieler ${id}`;
    const position=slots[index]||player?.position||'—';
    const actual=Number(team.players_points?.[id]??0);
    const projection=getProjection(id,league);
    const projectionText=projection===null?'—':fmt(projection);

    return `<div class="starter-player">
      <span class="starter-slot">${esc(position)}</span>
      <span class="starter-name" title="${esc(name)}">${esc(name)}</span>
      <span class="starter-points">
        <strong>${fmt(actual)}</strong><span class="starter-projection">/${projectionText}</span>
      </span>
    </div>`;
  }

  const count=Math.max(startersA.length,startersB.length);

  const rows=Array.from({length:count},(_,index)=>`
    <div class="starter-row">
      ${playerHtml(a,startersA[index],index)}
      ${playerHtml(b,startersB[index],index)}
    </div>
  `).join('');

  return `<div class="starter-table">
  ${rows}
</div>`;
}

function renderMatchups(matches,names,week,league){
  $('leagueName').textContent='OFF-LIGA';
  $('weekLabel').textContent='WEEK '+week;

  const byMatch=new Map();

  for(const matchup of matches){
    if(matchup.matchup_id==null)continue;

    if(!byMatch.has(matchup.matchup_id)){
      byMatch.set(matchup.matchup_id,[]);
    }

    byMatch.get(matchup.matchup_id).push(matchup);
  }

  const games=[...byMatch.values()]
    .filter(pair=>pair.length===2)
    .sort((a,b)=>
      Math.min(...a.map(t=>t.roster_id))-
      Math.min(...b.map(t=>t.roster_id))
    );

  const cards=games.slice(0,5).map((pair,index)=>{
    const[a,b]=[...pair].sort((x,y)=>getPoints(y)-getPoints(x));
    const ap=getPoints(a),bp=getPoints(b);
    const started=ap>0||bp>0;

    return `<article class="match">
      <div class="matchhead">
        <span>Matchup ${String(index+1).padStart(2,'0')}</span>
        <span class="live"><i class="dot"></i>${started?'PUNKTESTAND':'AUSSTEHEND'}</span>
      </div>

      <div class="match-teams">
        <div class="match-side">
          <div class="teamrow ${ap>bp?'winner':''}">
            ${teamLabelHtml(names[a.roster_id]||'Team '+a.roster_id)}
            <div class="score">${fmt(ap)}</div>
          </div>
          ${statsHtml(a,b,league)}
        </div>

        <div class="match-side">
          <div class="teamrow ${bp>ap?'winner':''}">
            ${teamLabelHtml(names[b.roster_id]||'Team '+b.roster_id)}
            <div class="score">${fmt(bp)}</div>
          </div>
          ${statsHtml(b,a,league)}
        </div>
      </div>

      ${matchupPlayersHtml(a,b,league)}
    </article>`;
  });

  while(cards.length<5){
    cards.push(`<article class="match placeholder">
      <div class="empty">Keine weitere Begegnung gefunden.</div>
    </article>`);
  }

  cards.push(`<section class="scoreboard">
    <div class="panelhead">
      <span>⚡ Live Scoring</span>
      <span class="live"><i class="dot"></i> LIVE</span>
    </div>
    <div class="score-subtitle">
      Punkteanstieg seit der letzten Abfrage · letzte 3 Minuten
    </div>
    <div class="scoring-list" id="scoringList">
      <div class="no-events">Warte auf neue Punkte …</div>
    </div>
  </section>`);

  $('matchups').innerHTML=cards.join('');
  renderScoring();
}

async function getPlayerDirectory(){
  if(!playerDirectoryPromise){
    playerDirectoryPromise=get('/players/nfl').then(data=>{
      const directory={};

      for(const[id,p]of Object.entries(data||{})){
        directory[id]={
          name:p.full_name||
            [p.first_name,p.last_name].filter(Boolean).join(' ')||
            'Unbekannter Spieler',
          team:p.team||'FA',
          position:p.position||'',
          injuryStatus:p.injury_status||'',
          status:p.status||''
        };
      }

      playerDirectoryCache=directory;
      return directory;
    }).catch(error=>{
      playerDirectoryPromise=null;
      throw error;
    });
  }

  return playerDirectoryPromise;
}

function collectPlayerPoints(matches){
  const points={};

  for(const matchup of matches){
    for(const[id,raw]of Object.entries(matchup.players_points||{})){
      const value=Number(raw);
      if(Number.isFinite(value)){
        points[id]=Math.max(points[id]??-Infinity,value);
      }
    }
  }

  return points;
}

async function updateScoring(matches,week){
  const current=collectPlayerPoints(matches),now=Date.now();

  if(previousPlayerPoints===null||lastWeek!==week){
    previousPlayerPoints=current;
    lastWeek=week;
    renderScoring();
    return;
  }

  const changes=[];

  for(const[id,total]of Object.entries(current)){
    const old=previousPlayerPoints[id];
    if(old===undefined)continue;

    const delta=total-old;
    if(delta>0.001){
      changes.push({playerId:id,delta,total,time:now});
    }
  }

  previousPlayerPoints=current;

  if(changes.length){
    try{
      const directory=await getPlayerDirectory();

      for(const change of changes){
        const player=directory[change.playerId]||{
          name:'Spieler '+change.playerId,
          team:'—',
          position:''
        };

        scoringEvents.push({
          ...change,
          name:player.name,
          nflTeam:player.team,
          position:player.position
        });
      }

      scoringEvents.sort((a,b)=>b.time-a.time);
      scoringEvents=scoringEvents.slice(0,MAX_EVENTS);
    }catch(error){
      console.warn('Spielernamen konnten nicht geladen werden:',error);
    }
  }

  scoringEvents=scoringEvents.filter(e=>now-e.time<EVENT_LIFETIME_MS);
  renderScoring();
}

function renderScoring(){
  const list=$('scoringList');
  if(!list)return;

  const now=Date.now();
  scoringEvents=scoringEvents.filter(e=>now-e.time<EVENT_LIFETIME_MS);

  if(!scoringEvents.length){
    list.innerHTML='<div class="no-events">Noch keine neuen Punkte erkannt.<br>Neue Punktesteigerungen erscheinen hier.</div>';
    return;
  }

  list.innerHTML=scoringEvents.slice(0,MAX_EVENTS).map(e=>`
    <div class="score-event">
      <div>
        <div class="event-name">${esc(e.name)}</div>
        <div class="event-meta">${esc(e.nflTeam)}${e.position?' · '+esc(e.position):''}</div>
      </div>
      <div class="event-points">
        <div class="event-delta">+${fmt(e.delta)}</div>
        <div class="event-total">${fmt(e.total)} Pkt.</div>
      </div>
    </div>
  `).join('');
}

function tickerStatus(event){
  const status=event?.status?.type;

  if(status?.state==='in')return status.shortDetail||'LIVE';
  if(status?.completed)return'ENDE';

  if(status?.name==='STATUS_SCHEDULED'){
    const date=event?.date?new Date(event.date):null;

    return date&&Number.isFinite(date.getTime())
      ?date.toLocaleString('de-DE',{
        weekday:'short',
        hour:'2-digit',
        minute:'2-digit'
      })
      :'GEPLANT';
  }

  return status?.shortDetail||status?.description||'GEPLANT';
}

async function refreshNflTicker(){
  const ticker=$('nflTicker');
  if(!ticker)return;

  try{
    const current=await getUrl(
      'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard'
    );

    const week=Number(current?.week?.number);
    const season=Number(current?.season?.year)||new Date().getFullYear();
    const seasonType=Number(current?.season?.type)||2;

    const url=week
      ?`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week=${week}&seasontype=${seasonType}&year=${season}`
      :'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';

    const data=week?await getUrl(url):current;
    const events=Array.isArray(data?.events)?data.events:[];

    const nextGameStates=Object.create(null);

    for(const event of events){
      const status=event?.status?.type;
      const state=status?.completed
        ?'completed'
        :status?.state==='in'
          ?'in'
          :status?.state==='pre'
            ?'pre'
            :null;

      if(!state)continue;

      for(const competitor of event?.competitions?.[0]?.competitors||[]){
        const abbreviation=competitor?.team?.abbreviation;

        if(abbreviation){
          nextGameStates[String(abbreviation).toUpperCase()]=state;
        }
      }
    }

    nflTeamGameStates=nextGameStates;

    if(!events.length){
      ticker.innerHTML=`<div class="ticker-empty">NFL-Spieltag ${week||''} · Spielstände derzeit nicht verfügbar.</div>`;
      return;
    }

    const items=events.map(event=>{
      const comp=event.competitions?.[0];
      const competitors=comp?.competitors||[];
      const away=competitors.find(c=>c.homeAway==='away')||competitors[0];
      const home=competitors.find(c=>c.homeAway==='home')||competitors[1];

      const teamName=c=>c?.team?.abbreviation||c?.team?.shortDisplayName||'TBD';
      const score=c=>c?.score!==undefined&&c?.score!==null&&c.score!==''?c.score:'—';

      return `<span class="ticker-game">
        <span>${esc(teamName(away))}</span>
        <span class="ticker-score">${esc(score(away))}</span>
        <span class="ticker-sep">@</span>
        <span>${esc(teamName(home))}</span>
        <span class="ticker-score">${esc(score(home))}</span>
        <span class="ticker-status">${esc(tickerStatus(event))}</span>
      </span>`;
    }).join('<span class="ticker-sep">◆</span>');

    ticker.innerHTML=`<div class="ticker-track">${items}${items}</div>`;
  }catch(error){
    console.warn('NFL-Spielstände konnten nicht geladen werden:',error);
    ticker.innerHTML='<div class="ticker-empty">NFL-Spielstände derzeit nicht verfügbar.</div>';
  }
}

async function refresh(){
  if(refreshing)return;
  refreshing=true;

  try{
    const[league,state,users,rosters]=await Promise.all([
      get('/league/'+LEAGUE_ID),
      get('/state/nfl'),
      get('/league/'+LEAGUE_ID+'/users'),
      get('/league/'+LEAGUE_ID+'/rosters')
    ]);

    if(!league){
      throw new Error('Liga nicht gefunden. Bitte LEAGUE_ID prüfen.');
    }

    const week=Number(state.display_week||state.week||1);
    const season=Number(league.season||state.league_season||state.season);
    const seasonType=league.season_type||state.season_type||'regular';

    await loadProjections(season,week,seasonType);

    try{
      await getPlayerDirectory();
    }catch(error){
      console.warn('Spielerverzeichnis für Prognosen nicht verfügbar:',error);
    }

    const matches=await get('/league/'+LEAGUE_ID+'/matchups/'+week);
    const userById=Object.fromEntries(users.map(u=>[u.user_id,u]));
    const names={};

    for(const roster of rosters){
      names[roster.roster_id]=managerName(userById[roster.owner_id]);
    }

    const safeMatches=Array.isArray(matches)?matches:[];
    renderMatchups(safeMatches,names,week,league);

    $('updated').textContent='Aktualisiert: '+new Date().toLocaleTimeString(
      'de-DE',
      {hour:'2-digit',minute:'2-digit',second:'2-digit'}
    );

    $('status').textContent='Verbunden · Aktualisierung alle 5 Sekunden · '+projectionMessage;
    $('status').classList.remove('error');

    try{
      await updateScoring(safeMatches,week);
    }catch(error){
      console.warn('Live-Scoring konnte nicht aktualisiert werden:',error);
    }
  }catch(error){
    console.error('Aktualisierung fehlgeschlagen:',error);
    $('updated').textContent='Aktualisierung fehlgeschlagen';
    $('status').textContent=error.message+' · Internetverbindung prüfen.';
    $('status').classList.add('error');

    if(!$('matchups').querySelector('.match')){
      $('matchups').innerHTML='<div class="empty">Sleeper-Daten konnten nicht geladen werden.<br><small>Bitte Internetverbindung prüfen und LEAGUE_ID kontrollieren.</small></div>';
    }
  }finally{
    refreshing=false;
  }
}

refresh();
setInterval(refresh,REFRESH_MS);
refreshNflTicker();
nflTickerTimer=setInterval(refreshNflTicker,60000);
})();

/* Proportionale Skalierung: gesamte 1280×720-Fläche sichtbar halten */
(() => {
  const stage=document.getElementById('stage');
  if(!stage)return;

  function fitStage(){
    const width=window.innerWidth;
    const height=window.innerHeight;
    if(!width||!height)return;

    const scale=Math.min(width/1280,height/720);
    stage.style.transform=`scale(${scale})`;
    stage.style.left=`${(width-1280*scale)/2}px`;
    stage.style.top=`${(height-720*scale)/2}px`;
  }

  window.addEventListener('resize',fitStage);
  window.addEventListener('orientationchange',fitStage);
  fitStage();
})();
</script>
