coreboard{grid-column:auto;grid-row:auto;min-width:0;display:flex;flex-direction:column}.score-subtitle{color:var(--muted);font-size:12px;margin:-8px 0 16px}.scoring-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.score-event{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;background:#0c121e;border:1px solid var(--line);border-radius:12px}.event-name{font-weight:700}.event-meta,.no-events{color:var(--muted);font-size:12px;margin-top:4px}.event-points{text-align:right;white-space:nowrap}.event-delta{font-weight:800;color:var(--accent)}.event-total{font-size:11px;color:var(--muted);margin-top:3px}.nfl-ticker{max-width:1800px;margin:12px auto 0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#0c121e;display:flex;align-items:center;min-height:44px}.ticker-label{flex:0 0 auto;padding:0 14px;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center}.ticker-viewport{overflow:hidden;flex:1;white-space:nowrap}.ticker-track{display:inline-flex;align-items:center;gap:28px;min-width:max-content;padding:10px 18px;animation:ticker-scroll 55s linear infinite}.nfl-ticker:hover .ticker-track{animation-play-state:paused}.ticker-game{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text)}.ticker-game .ticker-status{font-size:10px;color:var(--muted);text-transform:uppercase}.ticker-game .ticker-score{font-weight:800;font-variant-numeric:tabular-nums}.ticker-sep{color:var(--line)}@keyframes ticker-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}.ticker-empty{padding:10px 14px;color:var(--muted);font-size:12px}footer{max-width:1800px;margin:10px auto 0;display:flex;justify-content:space-between;gap:16px;color:#73819a;font-size:12px}.error{color:#ff9c9c}

  };
  function teamLabelHtml(name) {
    const normalized = String(name || '').trim().toLowerCase().replace(/\s+/g, ' ');
    const logoUrl = TEAM_LOGOS[normalized] || Object.entries(TEAM_LOGOS).find(([key]) => normalized.includes(key) || key.includes(normalized))?.[1];
    const logo = logoUrl ? `<img class="teamlogo" src="${logoUrl}" alt="" loading="eager" onerror="this.style.display='none'">` : '';
    return `<div class="teamlabel">${logo}<div class="teamname">${esc(name)}</div></div>`;
  }

  function renderMatchups(matches, names, week, league) {
    $('leagueName').textContent = league?.name || 'Eure Fantasy Football Liga';
    $('weekLabel').textContent = 'WEEK ' + week;
    const byMatch = new Map();
    for (const matchup of matches) {
      const rosterId = matchup.roster_id;
      if (!byMatch.has(matchup.matchup_id)) byMatch.set(matchup.matchup_id, []);
      byMatch.get(matchup.matchup_id).push(matchup);
    }
    const groups = [...byMatch.values()].filter(pair => pair.length === 2);
    const cards = groups.map(pair => {
      const [a, b] = pair;
      const nameA = names[a.roster_id] || 'Team ' + a.roster_id;
      const nameB = names[b.roster_id] || 'Team ' + b.roster_id;
      const pointsA = getPoints(a);
      const pointsB = getPoints(b);
      const winnerA = pointsA > pointsB;
      const winnerB = pointsB > pointsA;
      return `<article class="match">
        <div class="matchhead"><span>Matchup</span><span class="live"><span class="dot"></span>Live</span></div>
        <div class="teamrow ${winnerA ? 'winner' : ''}">
          ${teamLabelHtml(nameA)}
          <div class="score">${fmt(pointsA)}</div>
        </div>
        <div class="versus">GEGEN</div>
        <div class="teamrow ${winnerB ? 'winner' : ''}">
          ${teamLabelHtml(nameB)}
          <div class="score">${fmt(pointsB)}</div>
        </div>
        ${statsHtml(a, b, league)}
        ${statsHtml(b, a, league)}
      </article>`;
    });
    cards.push(`<article class="scoreboard">
      <div class="panelhead"><span>Live-Scoring</span><span>Letzte Ereignisse</span></div>
      <div class="score-subtitle">Punkteveränderungen deiner Liga</div>
      <div class="scoring-list" id="scoringEvents"><div class="no-events">Warte auf Scoring-Ereignisse …</div></div>
    </article>`);
    $('matchups').innerHTML = cards.join('');
  }

  async function getPlayerDirectory() {
    if (!playerDirectoryPromise) {
      playerDirectoryPromise = get('/players/nfl');
    }
    return playerDirectoryPromise;
  }

  async function updateScoring(matches, week) {
    if (lastWeek !== week) {
      previousPlayerPoints = null;
      scoringEvents = [];
      lastWeek = week;
    }
    const current = Object.create(null);
    for (const team of matches) {
      const players = team.players_points || {};
      for (const [playerId, points] of Object.entries(players)) {
        current[playerId] = Number(points) || 0;
      }
    }
    if (previousPlayerPoints === null) {
      previousPlayerPoints = current;
      renderScoringEvents();
      return;
    }
    const changes = [];
    for (const [playerId, points] of Object.entries(current)) {
      const old = Number(previousPlayerPoints[playerId] || 0);
      const delta = points - old;
      if (delta >= 0.1) changes.push({playerId, delta, total: points});
    }
    previousPlayerPoints = current;
    if (!changes.length) {
      renderScoringEvents();
      return;
    }
    let directory = {};
    try { directory = await getPlayerDirectory(); }
    catch (error) { console.warn('Spielernamen konnten nicht geladen werden:', error); }
    for (const change of changes) {
      const player = directory[change.playerId] || {};
      const name = [player.first_name, player.last_name].filter(Boolean).join(' ') || 'Spieler';
      const position = player.position || '';
      scoringEvents.unshift({
        id: `${change.playerId}-${Date.now()}-${Math.random()}`,
        name,
        position,
        delta: change.delta,
        total: change.total,
        time: Date.now()
      });
    }
    scoringEvents = scoringEvents
      .filter(event => Date.now() - event.time < EVENT_LIFETIME_MS)
      .slice(0, MAX_EVENTS);
    renderScoringEvents();
  }

  function renderScoringEvents() {
    const container = $('scoringEvents');
    if (!container) return;
    scoringEvents = scoringEvents.filter(event => Date.now() - event.time < EVENT_LIFETIME_MS);
    if (!scoringEvents.length) {
      container.innerHTML = '<div class="no-events">Noch keine neuen Punkte. Ereignisse erscheinen automatisch.</div>';
      return;
    }
    container.innerHTML = scoringEvents.map(event => `
      <div class="score-event">
        <div><div class="event-name">${esc(event.name)}</div>
          <div class="event-meta">${esc(event.position)} · ${new Date(event.time).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div>
        </div>
        <div class="event-points"><div class="event-delta">+${fmt(event.delta)}</div>
          <div class="event-total">${fmt(event.total)} gesamt</div>
        </div>
      </div>`).join('');
  }

  function tickerStatus(event) {
    const status = event?.status || {};
    if (status.type?.state === 'in') return status.displayClock || 'Live';
    if (status.type?.completed) return 'Beendet';
    return status.type?.shortDetail || status.type?.detail || 'Geplant';
  }
