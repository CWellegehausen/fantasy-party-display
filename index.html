<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Fantasy Football · Partyraum</title>
<style>
:root{--bg:#090d15;--panel:#131a27;--panel2:#192235;--line:#29354a;--muted:#a8b4c8;--text:#f4f7fc;--accent:#a7f36b;--blue:#79b8ff;--gold:#ffd36a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{padding:clamp(8px,1.2vw,18px);background:radial-gradient(ellipse at 50% -20%,#263957 0%,var(--bg) 60%)}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 auto 12px;max-width:1800px;border-bottom:1px solid var(--line);padding-bottom:10px}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:clamp(10px,.75vw,13px);font-weight:700;color:var(--accent)}h1{font-size:clamp(22px,2.3vw,36px);line-height:1;margin:5px 0 0;letter-spacing:-.04em}.sub{color:var(--muted);font-size:clamp(11px,.9vw,14px);margin-top:5px}.right{text-align:right}.week{font-size:clamp(15px,1.4vw,22px);font-weight:800}.updated{font-size:10px;color:var(--muted);margin-top:4px}
main{max-width:1800px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(250px,1fr);align-items:stretch;gap:10px}.match,.scoreboard{height:100%;background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:clamp(10px,1vw,15px);box-shadow:0 10px 35px #0003;min-width:0}.matchhead,.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}.live{color:var(--accent);display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:var(--accent);box-shadow:0 0 12px #a7f36b88}.teamrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0}.teamname{font-size:clamp(14px,1.25vw,20px);font-weight:800;overflow-wrap:anywhere}.score{font-size:clamp(21px,2vw,30px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.winner .score{color:var(--accent)}.versus{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:11px;margin:2px 0}.versus:before,.versus:after{content:"";height:1px;background:var(--line);flex:1}.teamstats{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;padding:5px 0 6px;color:var(--muted);font-size:11px;border-top:1px solid #29354a88}.teamstats strong{color:var(--text);font-size:15px;font-variant-numeric:tabular-nums}.winchance strong{color:var(--accent)}.subnote{font-size:11px;color:var(--muted);margin-top:2px}.empty{grid-column:1/-1;text-align:center;padding:55px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);font-size:18px}.scoreboard{grid-column:auto;grid-row:auto;min-width:0;display:flex;flex-direction:column}.score-subtitle{color:var(--muted);font-size:12px;margin:-8px 0 16px}.scoring-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.score-event{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;background:#0c121e;border:1px solid var(--line);border-radius:12px}.event-name{font-weight:700}.event-meta,.no-events{color:var(--muted);font-size:12px;margin-top:4px}.event-points{text-align:right;white-space:nowrap}.event-delta{font-weight:800;color:var(--accent)}.event-total{font-size:11px;color:var(--muted);margin-top:3px}.nfl-ticker{max-width:1800px;margin:12px auto 0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#0c121e;display:flex;align-items:center;min-height:44px}.ticker-label{flex:0 0 auto;padding:0 14px;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center}.ticker-viewport{overflow:hidden;flex:1;white-space:nowrap}.ticker-track{display:inline-flex;align-items:center;gap:28px;min-width:max-content;padding:10px 18px;animation:ticker-scroll 55s linear infinite}.nfl-ticker:hover .ticker-track{animation-play-state:paused}.ticker-game{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text)}.ticker-game .ticker-status{font-size:10px;color:var(--muted);text-transform:uppercase}.ticker-game .ticker-score{font-weight:800;font-variant-numeric:tabular-nums}.ticker-sep{color:var(--line)}@keyframes ticker-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}.ticker-empty{padding:10px 14px;color:var(--muted);font-size:12px}footer{max-width:1800px;margin:10px auto 0;display:flex;justify-content:space-between;gap:16px;color:#73819a;font-size:12px}.error{color:#ff9c9c}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(250px,auto)}}
@media(max-width:650px){.grid,.scoring-list{grid-template-columns:1fr;grid-auto-rows:auto}header{align-items:flex-start;flex-direction:column}.right{text-align:left}footer{flex-direction:column}}
</style>
</head>
<body>
<header>
  <div><div class="eyebrow">Sleeper · Fantasy Football</div><h1>LEAGUE MATCHUPS</h1><div class="sub" id="leagueName">Punkte live aus eurer Liga</div></div>
  <div class="right"><div class="week" id="weekLabel">WEEK —</div><div class="updated" id="updated">Verbinde mit Sleeper …</div></div>
</header>
<main><div class="grid" id="matchups"><div class="empty">Lade aktuelle Punktestände und Projektionen …</div></div></main>
<div class="nfl-ticker" aria-label="NFL-Spielstände">
  <div class="ticker-label">NFL LIVE</div>
  <div class="ticker-viewport" id="nflTicker"><div class="ticker-empty">NFL-Spielstände werden geladen …</div></div>
</div>
<footer><span id="status">Datenquelle: Sleeper API</span><span>Automatische Aktualisierung alle 5 Sekunden</span></footer>
<script>
(() => {
  'use strict';
  // Eure Liga-ID aus der bisherigen Datei. Bei einer anderen Liga hier ändern.
  const LEAGUE_ID = '1309297618647547904';
  const API = 'https://api.sleeper.app/v1';
  const PROJECTION_API = 'https://api.sleeper.com';
  const REFRESH_MS = 5000;
  const MAX_EVENTS = 10;
  const EVENT_LIFETIME_MS = 3 * 60 * 1000;
  const $ = id => document.getElementById(id);
  const fmt = n => Number(n || 0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
  let projectionMap = Object.create(null);
  let projectionMessage = 'Projektionen noch nicht geladen';
  let projectionKey = '';
  let playerDirectoryPromise = null;
  let previousPlayerPoints = null;
  let lastWeek = null;
  let scoringEvents = [];
  let refreshing = false;
  let nflTickerTimer = null;

  async function getUrl(url) {
    const response = await fetch(url, {cache:'no-store'});
    if (!response.ok) throw new Error('API antwortet mit HTTP ' + response.status);
    return response.json();
  }
  async function get(path) { return getUrl(API + path); }
  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function managerName(user) {
    return user?.metadata?.team_name || user?.display_name || user?.username || 'Team';
  }
  function getPoints(team) {
    const value = Number(team?.custom_points ?? team?.points ?? 0);
    return Number.isFinite(value) ? value : 0;
  }
  function scoringMode(league) {
    const scoring = league?.scoring_settings || {};
    const reception = Number(scoring.rec ?? scoring.rec_pts ?? 0);
    if (reception >= 0.99) return 'ppr';
    if (reception >= 0.49) return 'half';
    return 'standard';
  }

  // Holt Spielerprognosen direkt aus der Sleeper-Projections-API und indiziert sie nach player_id.
  async function loadProjections(season, week, seasonType) {
    const type = seasonType || 'regular';
    const key = `${season}-${week}-${type}`;
    if (key === projectionKey && Object.keys(projectionMap).length) return;
    projectionKey = key;
    projectionMap = Object.create(null);
    projectionMessage = 'Projektionen werden geladen …';
    const url = `${PROJECTION_API}/projections/nfl/${season}/${week}?season_type=${encodeURIComponent(type)}`;
    try {
      const data = await getUrl(url);
      // Sleeper liefert Projektionen je nach Antwortformat entweder als Array
      // oder als Objekt, dessen Schlüssel bereits die player_id ist.
      const rows = Array.isArray(data)
        ? data.map(item => [String(item?.player_id ?? item?.player?.player_id ?? ''), item])
        : Object.entries(data || {}).map(([key, item]) => [String(item?.player_id ?? item?.player?.player_id ?? key), item]);
      const next = Object.create(null);
      for (const [rowId, item] of rows) {
        if (!item || (item.category && item.category !== 'proj')) continue;
        const id = rowId;
        if (!id) continue;
        const stats = item.stats ?? item.projection ?? item;
        const numberOrNull = value => {
          if (value === null || value === undefined || value === '') return null;
          const number = Number(value);
          return Number.isFinite(number) ? number : null;
        };
        const ppr = numberOrNull(stats?.pts_ppr);
        const half = numberOrNull(stats?.pts_half_ppr);
        const standard = numberOrNull(stats?.pts_std);
        if (ppr !== null || half !== null || standard !== null) {
          next[id] = {ppr, half, standard};
        }
      }
      projectionMap = next;
      const count = Object.keys(next).length;
      projectionMessage = count ? `Projektionen geladen (${count} Spieler)` : 'Keine Punkteprojektionen gefunden';
      console.info('Sleeper-Projektionen:', count, 'Spieler; Saison:', season, 'Woche:', week);
    } catch (error) {
      console.error('Projektionen konnten nicht geladen werden:', error);
      projectionMessage = 'Projektionen konnten nicht geladen werden';
    }
  }

  function getProjection(playerId, league) {
    const projection = projectionMap[String(playerId)];
    if (!projection) return null;
    const mode = scoringMode(league);
    const value = projection[mode];
    return value !== null && value !== undefined && Number.isFinite(value) ? value : null;
  }

  // Team-Endprognose:
  // Aktuelle Team-Punkte + (Spielerprognose - bereits erzielte Spielerpunkte)
  // für jeden Starter. Negative Restwerte werden auf 0 begrenzt.
  function projectedTeamTotal(team, league) {
    const current = getPoints(team);
    const actual = team?.players_points || {};
    const starters = (team?.starters || []).filter(
      id => id !== null && id !== undefined && id !== ''
    );

    let remaining = 0;
    let found = 0;
    let missing = 0;

    for (const id of starters) {
      const projection = getProjection(id, league);
      if (projection === null || !Number.isFinite(projection)) {
        missing++;
        continue;
      }

      const rawScored = Number(actual[id] ?? 0);
      const scored = Number.isFinite(rawScored) ? rawScored : 0;
      remaining += Math.max(0, projection - scored);
      found++;
    }

    return {
      total: current + remaining,
      current,
      remaining,
      found,
      missing,
      starterCount: starters.length
    };
  }

  // Eigene grobe Schätzung, keine offizielle Sleeper-Wahrscheinlichkeit.
  function estimatedWinChance(a, b) {
    return 100 / (1 + Math.exp(-(a - b) / 12));
  }
  function statsHtml(team, opponent, league) {
    const a = projectedTeamTotal(team, league);
    const b = projectedTeamTotal(opponent, league);
    const complete = a.missing === 0 && b.missing === 0 && a.found > 0 && b.found > 0;
    const chance = complete ? Math.round(estimatedWinChance(a.total, b.total)) : null;
    const coverage = a.starterCount ? `${a.found}/${a.starterCount} Starter` : 'Keine Starter';
    return `<div class="teamstats">
      <span>Prognose <strong>${a.found ? fmt(a.total) : '—'}</strong><div class="subnote">Eigene Schätzung · ${coverage}${a.missing ? ' · unvollständig' : ''}</div></span>
      <span class="winchance">Siegchance <strong>${chance === null ? '—' : chance + ' %'}</strong><div class="subnote">${chance === null ? 'Prognosen unvollständig' : 'Eigene Schätzung'}</div></span>
    </div>`;
  }

  function renderMatchups(matches, names, week, league) {
    $('leagueName').textContent = league?.name || 'Eure Fantasy Football Liga';
    $('weekLabel').textContent = 'WEEK ' + week;
    const byMatch = new Map();
    for (const matchup of matches) {
      if (matchup.matchup_id == null) continue;
      if (!byMatch.has(matchup.matchup_id)) byMatch.set(matchup.matchup_id, []);
      byMatch.get(matchup.matchup_id).push(matchup);
    }
    const games = [...byMatch.values()].filter(pair => pair.length === 2)
      .sort((a,b) => Math.min(...a.map(t => t.roster_id)) - Math.min(...b.map(t => t.roster_id)));
    const cards = games.slice(0,5).map((pair,index) => {
      const [a,b] = [...pair].sort((x,y) => getPoints(y) - getPoints(x));
      const ap = getPoints(a), bp = getPoints(b);
      const started = ap > 0 || bp > 0;
      return `<article class="match">
        <div class="matchhead"><span>Matchup ${String(index+1).padStart(2,'0')}</span><span class="live"><i class="dot"></i>${started ? 'PUNKTESTAND' : 'AUSSTEHEND'}</span></div>
        <div class="teamrow ${ap>bp?'winner':''}"><div class="teamname">${esc(names[a.roster_id] || 'Team '+a.roster_id)}</div><div class="score">${fmt(ap)}</div></div>
        ${statsHtml(a,b,league)}
        <div class="versus">VS</div>
        <div class="teamrow ${bp>ap?'winner':''}"><div class="teamname">${esc(names[b.roster_id] || 'Team '+b.roster_id)}</div><div class="score">${fmt(bp)}</div></div>
        ${statsHtml(b,a,league)}
      </article>`;
    });
    while (cards.length < 5) cards.push(`<article class="match placeholder"><div class="empty">Keine weitere Begegnung gefunden.</div></article>`);
    cards.push(`<section class="scoreboard"><div class="panelhead"><span>⚡ Live Scoring</span><span class="live"><i class="dot"></i> LIVE</span></div><div class="score-subtitle">Punkteanstieg seit der letzten Abfrage · letzte 3 Minuten</div><div class="scoring-list" id="scoringList"><div class="no-events">Warte auf neue Punkte …</div></div></section>`);
    $('matchups').innerHTML = cards.join('');
    renderScoring();
  }

  async function getPlayerDirectory() {
    if (!playerDirectoryPromise) {
      playerDirectoryPromise = get('/players/nfl').then(data => {
        const directory = {};
        for (const [id,p] of Object.entries(data || {})) {
          directory[id] = {name:p.full_name || [p.first_name,p.last_name].filter(Boolean).join(' ') || 'Unbekannter Spieler',team:p.team || 'FA',position:p.position || ''};
        }
        return directory;
      }).catch(error => {playerDirectoryPromise = null; throw error;});
    }
    return playerDirectoryPromise;
  }
  function collectPlayerPoints(matches) {
    const points = {};
    for (const matchup of matches) {
      for (const [id,raw] of Object.entries(matchup.players_points || {})) {
        const value = Number(raw);
        if (Number.isFinite(value)) points[id] = Math.max(points[id] ?? -Infinity,value);
      }
    }
    return points;
  }
  async function updateScoring(matches, week) {
    const current = collectPlayerPoints(matches), now = Date.now();
    if (previousPlayerPoints === null || lastWeek !== week) {
      previousPlayerPoints = current; lastWeek = week; renderScoring(); return;
    }
    const changes = [];
    for (const [id,total] of Object.entries(current)) {
      const old = previousPlayerPoints[id];
      if (old === undefined) continue;
      const delta = total - old;
      if (delta > 0.001) changes.push({playerId:id,delta,total,time:now});
    }
    previousPlayerPoints = current;
    if (changes.length) {
      try {
        const directory = await getPlayerDirectory();
        for (const change of changes) {
          const player = directory[change.playerId] || {name:'Spieler '+change.playerId,team:'—',position:''};
          scoringEvents.push({...change,name:player.name,nflTeam:player.team,position:player.position});
        }
        scoringEvents.sort((a,b) => b.time-a.time);
        scoringEvents = scoringEvents.slice(0,MAX_EVENTS);
      } catch (error) { console.warn('Spielernamen konnten nicht geladen werden:',error); }
    }
    scoringEvents = scoringEvents.filter(e => now-e.time < EVENT_LIFETIME_MS);
    renderScoring();
  }
  function renderScoring() {
    const list = $('scoringList');
    if (!list) return;
    const now = Date.now();
    scoringEvents = scoringEvents.filter(e => now-e.time < EVENT_LIFETIME_MS);
    if (!scoringEvents.length) {
      list.innerHTML = '<div class="no-events">Noch keine neuen Punkte erkannt.<br>Neue Punktesteigerungen erscheinen hier.</div>';
      return;
    }
    list.innerHTML = scoringEvents.slice(0,MAX_EVENTS).map(e => `<div class="score-event"><div><div class="event-name">${esc(e.name)}</div><div class="event-meta">${esc(e.nflTeam)}${e.position ? ' · '+esc(e.position) : ''}</div></div><div class="event-points"><div class="event-delta">+${fmt(e.delta)}</div><div class="event-total">${fmt(e.total)} Pkt.</div></div></div>`).join('');
  }

  function tickerStatus(event) {
    const status = event?.status?.type;
    if (status?.state === 'in') return status.shortDetail || 'LIVE';
    if (status?.completed) return 'ENDE';
    if (status?.name === 'STATUS_SCHEDULED') {
      const date = event?.date ? new Date(event.date) : null;
      return date && Number.isFinite(date.getTime())
        ? date.toLocaleString('de-DE', {weekday:'short',hour:'2-digit',minute:'2-digit'})
        : 'GEPLANT';
    }
    return status?.shortDetail || status?.description || 'GEPLANT';
  }
  async function refreshNflTicker() {
    const ticker = $('nflTicker');
    if (!ticker) return;
    try {
      // Erst den aktuellen NFL-Spieltag ermitteln, dann den kompletten Spieltag laden.
      // So bleiben auch bereits beendete und erst später angesetzte Spiele sichtbar.
      const current = await getUrl('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
      const week = Number(current?.week?.number);
      const season = Number(current?.season?.year) || new Date().getFullYear();
      const seasonType = Number(current?.season?.type) || 2;
      const url = week
        ? `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week=${week}&seasontype=${seasonType}&year=${season}`
        : 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
      const data = week ? await getUrl(url) : current;
      const events = Array.isArray(data?.events) ? data.events : [];
      if (!events.length) {
        ticker.innerHTML = `<div class="ticker-empty">NFL-Spieltag ${week || ''} · Spielstände derzeit nicht verfügbar.</div>`;
        return;
      }
      const items = events.map(event => {
        const comp = event.competitions?.[0];
        const competitors = comp?.competitors || [];
        const away = competitors.find(c => c.homeAway === 'away') || competitors[0];
        const home = competitors.find(c => c.homeAway === 'home') || competitors[1];
        const teamName = c => c?.team?.abbreviation || c?.team?.shortDisplayName || 'TBD';
        const score = c => c?.score !== undefined && c?.score !== null && c.score !== '' ? c.score : '—';
        return `<span class="ticker-game"><span>${esc(teamName(away))}</span><span class="ticker-score">${esc(score(away))}</span><span class="ticker-sep">@</span><span>${esc(teamName(home))}</span><span class="ticker-score">${esc(score(home))}</span><span class="ticker-status">${esc(tickerStatus(event))}</span></span>`;
      }).join('<span class="ticker-sep">◆</span>');
      // Zweite Kopie sorgt für einen nahtlosen Lauf des Bands.
      ticker.innerHTML = `<div class="ticker-track">${items}${items}</div>`;
    } catch (error) {
      console.warn('NFL-Spielstände konnten nicht geladen werden:', error);
      ticker.innerHTML = '<div class="ticker-empty">NFL-Spielstände derzeit nicht verfügbar.</div>';
    }
  }

  async function refresh() {
    if (refreshing) return;
    refreshing = true;
    try {
      const [league,state,users,rosters] = await Promise.all([
        get('/league/'+LEAGUE_ID),get('/state/nfl'),get('/league/'+LEAGUE_ID+'/users'),get('/league/'+LEAGUE_ID+'/rosters')
      ]);
      if (!league) throw new Error('Liga nicht gefunden. Bitte LEAGUE_ID prüfen.');
      const week = Number(state.display_week || state.week || 1);
      const season = Number(league.season || state.league_season || state.season);
      const seasonType = league.season_type || state.season_type || 'regular';
      await loadProjections(season,week,seasonType);
      const matches = await get('/league/'+LEAGUE_ID+'/matchups/'+week);
      const userById = Object.fromEntries(users.map(u => [u.user_id,u]));
      const names = {};
      for (const roster of rosters) names[roster.roster_id] = managerName(userById[roster.owner_id]);
      const safeMatches = Array.isArray(matches) ? matches : [];
      renderMatchups(safeMatches,names,week,league);
      $('updated').textContent = 'Aktualisiert: '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      $('status').textContent = 'Verbunden · Aktualisierung alle 5 Sekunden · '+projectionMessage;
      $('status').classList.remove('error');
      try { await updateScoring(safeMatches,week); } catch (error) { console.warn('Live-Scoring konnte nicht aktualisiert werden:',error); }
    } catch (error) {
      console.error('Aktualisierung fehlgeschlagen:',error);
      $('updated').textContent = 'Aktualisierung fehlgeschlagen';
      $('status').textContent = error.message+' · Internetverbindung prüfen.';
      $('status').classList.add('error');
      if (!$('matchups').querySelector('.match')) $('matchups').innerHTML = '<div class="empty">Sleeper-Daten konnten nicht geladen werden.<br><small>Bitte Internetverbindung prüfen und LEAGUE_ID kontrollieren.</small></div>';
    } finally { refreshing = false; }
  }
  refresh();
  setInterval(refresh,REFRESH_MS);
  refreshNflTicker();
  nflTickerTimer = setInterval(refreshNflTicker,60000);
})();
</script>
</body>
</html>
