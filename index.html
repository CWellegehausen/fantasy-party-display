
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Fantasy Football · Partyraum</title>

<style>
:root {
  --bg: #090d15;
  --panel: #131a27;
  --panel2: #192235;
  --line: #29354a;
  --muted: #a8b4c8;
  --text: #f4f7fc;
  --accent: #a7f36b;
  --blue: #79b8ff;
  --gold: #ffd36a;
  --red: #ff9c9c;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

body {
  height: 100vh;
  height: 100dvh;
  padding: 18px 24px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: radial-gradient(
    ellipse at 50% -20%,
    #263957 0%,
    var(--bg) 60%
  );
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin: 0 auto 14px;
  width: 100%;
  max-width: 1800px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
  flex-shrink: 0;
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: .18em;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
}

h1 {
  font-size: clamp(28px, 3vw, 46px);
  line-height: 1;
  margin: 7px 0 0;
  letter-spacing: -.04em;
}

.sub {
  color: var(--muted);
  font-size: 15px;
  margin-top: 8px;
}

.right {
  text-align: right;
  white-space: nowrap;
}

.week {
  font-size: 25px;
  font-weight: 800;
}

.updated {
  font-size: 13px;
  color: var(--muted);
  margin-top: 6px;
}

main {
  width: 100%;
  max-width: 1800px;
  margin: 0 auto;
  flex: 1;
  min-height: 0;
}

.grid {
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.panel {
  background: linear-gradient(145deg, var(--panel2), var(--panel));
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 18px;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.match {
  justify-content: center;
}

.matchhead,
.panelhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .1em;
  font-weight: 700;
  flex-shrink: 0;
}

.live {
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

.teamrow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
}

.teamrow + .teamrow {
  border-top: 1px solid var(--line);
}

.teamname {
  font-size: clamp(16px, 1.35vw, 24px);
  font-weight: 800;
  overflow-wrap: anywhere;
}

.score {
  font-size: clamp(24px, 2.3vw, 36px);
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.04em;
}

.winner .score { color: var(--accent); }

.versus {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 10px;
  margin: 2px 0;
}

.versus::before,
.versus::after {
  content: "";
  height: 1px;
  background: var(--line);
  flex: 1;
}

.empty {
  text-align: center;
  padding: 24px 16px;
  color: var(--muted);
  font-size: 16px;
}

.scoreboard {
  grid-column: 3;
  grid-row: 2;
}

.scoreboard .panelhead {
  margin-bottom: 6px;
}

.score-subtitle {
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 8px;
  flex-shrink: 0;
}

.scoring-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-height: 0;
  overflow: hidden;
}

.score-event {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(255,255,255,.055);
  border-radius: 8px;
  padding: 7px 9px;
  min-width: 0;
}

.event-name {
  font-size: 13px;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.event-meta {
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.event-points {
  text-align: right;
  white-space: nowrap;
}

.event-delta {
  color: var(--accent);
  font-size: 16px;
  font-weight: 900;
}

.event-total {
  color: var(--muted);
  font-size: 10px;
  margin-top: 3px;
}

.no-events {
  color: var(--muted);
  text-align: center;
  margin: auto 0;
  padding: 12px 4px;
  font-size: 13px;
  line-height: 1.5;
}

footer {
  width: 100%;
  max-width: 1800px;
  margin: 10px auto 0;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: #73819a;
  font-size: 11px;
  flex-shrink: 0;
}

.error { color: var(--red); }

@media (max-height: 700px) {
  body { padding: 10px 18px; }

  header {
    margin-bottom: 8px;
    padding-bottom: 8px;
  }

  h1 { font-size: clamp(24px, 2.5vw, 36px); }

  .sub {
    margin-top: 5px;
    font-size: 12px;
  }

  .panel { padding: 8px 12px; }

  .matchhead,
  .panelhead {
    margin-bottom: 5px;
    font-size: 10px;
  }

  .teamrow { padding: 5px 0; }

  .teamname { font-size: clamp(14px, 1.2vw, 20px); }

  .score { font-size: clamp(20px, 2vw, 30px); }

  .score-event { padding: 5px 7px; }

  .event-name { font-size: 12px; }

  footer { margin-top: 6px; }
}

@media (max-width: 700px) {
  body {
    padding: 12px;
    overflow: auto;
    height: auto;
    min-height: 100vh;
  }

  header {
    align-items: flex-start;
    gap: 10px;
  }

  h1 { font-size: 26px; }

  .eyebrow { font-size: 10px; }

  .sub { font-size: 12px; }

  .week { font-size: 18px; }

  .updated { font-size: 10px; }

  main { flex: none; }

  .grid {
    height: auto;
    grid-template-columns: 1fr;
    grid-template-rows: auto;
  }

  .panel { min-height: 150px; }

  .teamname { font-size: 20px; }

  .score { font-size: 30px; }

  .scoreboard {
    grid-column: auto;
    grid-row: auto;
    min-height: 250px;
  }

  .scoring-list { overflow: visible; }

  footer { flex-direction: column; }
}
</style>
</head>

<body>
<header>
  <div>
    <div class="eyebrow">Sleeper · Fantasy Football</div>
    <h1>LEAGUE MATCHUPS</h1>
    <div class="sub" id="leagueName">Punkte live aus eurer Liga</div>
  </div>

  <div class="right">
    <div class="week" id="weekLabel">WEEK —</div>
    <div class="updated" id="updated">Verbinde mit Sleeper …</div>
  </div>
</header>

<main>
  <div class="grid" id="matchups">
    <div class="empty">Lade aktuelle Punktestände …</div>
  </div>
</main>

<footer>
  <span id="status">Datenquelle: Sleeper API</span>
  <span>Automatische Aktualisierung alle 5 Sekunden</span>
</footer>

<script>
(() => {
  'use strict';

  const LEAGUE_ID = '1309297618647547904';
  const API = 'https://api.sleeper.app/v1';
  const REFRESH_MS = 5000;
  const EVENT_LIFETIME_MS = 180000;
  const MAX_EVENTS = 8;

  const $ = id => document.getElementById(id);

  let refreshing = false;
  let playerDirectoryPromise = null;
  let previousPlayerPoints = null;
  let scoringEvents = [];
  let lastWeek = null;

  const fmt = n => Number(n || 0).toLocaleString('de-DE', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

  async function get(path) {
    const response = await fetch(API + path, {
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error('Sleeper API antwortet mit ' + response.status);
    }

    return response.json();
  }

  function managerName(user) {
    return user?.metadata?.team_name
      || user?.display_name
      || user?.username
      || 'Team';
  }

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[character]);
  }

  function getPoints(team) {
    return Number(team.custom_points ?? team.points ?? 0);
  }

  function renderMatchups(matches, names, week, league) {
    $('leagueName').textContent =
      league?.name || 'Eure Fantasy Football Liga';

    $('weekLabel').textContent = 'WEEK ' + week;

    const byMatch = new Map();

    for (const matchup of matches) {
      if (matchup.matchup_id == null) continue;

      if (!byMatch.has(matchup.matchup_id)) {
        byMatch.set(matchup.matchup_id, []);
      }

      byMatch.get(matchup.matchup_id).push(matchup);
    }

    // Nur vollständige Begegnungen anzeigen; 0:0 zählt ebenfalls.
    const games = [...byMatch.values()]
      .filter(pair => pair.length === 2)
      .sort((a, b) =>
        Math.min(...a.map(team => team.roster_id))
        - Math.min(...b.map(team => team.roster_id))
      );

    const cards = games.slice(0, 5).map((pair, index) => {
      const sorted = [...pair].sort((a, b) =>
        getPoints(b) - getPoints(a)
      );

      const [a, b] = sorted;
      const ap = getPoints(a);
      const bp = getPoints(b);
      const started = ap > 0 || bp > 0;
      const aWin = ap > bp;
      const bWin = bp > ap;

      return `
        <article class="panel match">
          <div class="matchhead">
            <span>Matchup ${String(index + 1).padStart(2, '0')}</span>
            <span class="live">
              <i class="dot"></i>
              ${started ? 'PUNKTESTAND' : 'AUSSTEHEND'}
            </span>
          </div>

          <div class="teamrow ${aWin ? 'winner' : ''}">
            <div class="teamname">
              ${esc(names[a.roster_id] || 'Team ' + a.roster_id)}
            </div>
            <div class="score">${fmt(ap)}</div>
          </div>

          <div class="versus">VS</div>

          <div class="teamrow ${bWin ? 'winner' : ''}">
            <div class="teamname">
              ${esc(names[b.roster_id] || 'Team ' + b.roster_id)}
            </div>
            <div class="score">${fmt(bp)}</div>
          </div>
        </article>
      `;
    });

    while (cards.length < 5) {
      cards.push(`
        <article class="panel match">
          <div class="empty">
            ${games.length === 0
              ? 'Noch keine Matchups gefunden.'
              : 'Keine weitere Begegnung.'}
          </div>
        </article>
      `);
    }

    cards.push(`
      <section class="panel scoreboard">
        <div class="panelhead">
          <span>⚡ Live Scoring</span>
          <span class="live"><i class="dot"></i> LIVE</span>
        </div>
        <div class="score-subtitle">
          Punkteanstieg seit der letzten Abfrage · letzte 3 Minuten
        </div>
        <div class="scoring-list" id="scoringList">
          <div class="no-events">Warte auf neue Punkte …</div>
        </div>
      </section>
    `);

    $('matchups').innerHTML = cards.join('');
    renderScoring();
  }

  // Spielerinformationen werden einmalig geladen und wiederverwendet.
  async function getPlayerDirectory() {
    if (!playerDirectoryPromise) {
      playerDirectoryPromise = get('/players/nfl').then(data => {
        const directory = {};

        for (const [id, player] of Object.entries(data || {})) {
          directory[id] = {
            name: player.full_name
              || [player.first_name, player.last_name]
                .filter(Boolean).join(' ')
              || 'Unbekannter Spieler',
            team: player.team || 'FA',
            position: player.position || ''
          };
        }

        return directory;
      }).catch(error => {
        playerDirectoryPromise = null;
        throw error;
      });
    }

    return playerDirectoryPromise;
  }

  function collectPlayerPoints(matches) {
    const points = {};

    for (const matchup of matches) {
      const rosterPoints = matchup.players_points || {};

      for (const [playerId, rawPoints] of Object.entries(rosterPoints)) {
        const value = Number(rawPoints);

        if (!Number.isFinite(value)) continue;

        // Bei doppelten Einträgen den höchsten gefundenen Wert behalten.
        points[playerId] = Math.max(points[playerId] ?? -Infinity, value);
      }
    }

    return points;
  }

  async function updateScoring(matches, names) {
    const current = collectPlayerPoints(matches);
    const now = Date.now();

    // Beim ersten Abruf einen Ausgangswert setzen, nicht alte Punkte
    // fälschlich als gerade erzielte Punkte anzeigen.
    if (previousPlayerPoints === null || lastWeek !== $('weekLabel').textContent) {
      previousPlayerPoints = current;
      lastWeek = $('weekLabel').textContent;
      renderScoring();
      return;
    }

    const changes = [];

    for (const [playerId, total] of Object.entries(current)) {
      const oldTotal = previousPlayerPoints[playerId];

      // Neue Spielerwerte ohne bekannten vorherigen Stand dienen
      // nicht als sicherer Nachweis eines gerade erzielten Scores.
      if (oldTotal === undefined) continue;

      const delta = total - oldTotal;

      if (delta > 0.001) {
        changes.push({ playerId, delta, total, time: now });
      }
    }

    previousPlayerPoints = current;

    if (changes.length) {
      try {
        const directory = await getPlayerDirectory();

        for (const change of changes) {
          const player = directory[change.playerId] || {
            name: 'Spieler ' + change.playerId,
            team: '—',
            position: ''
          };

          scoringEvents.push({
            ...change,
            name: player.name,
            nflTeam: player.team,
            position: player.position
          });
        }

        scoringEvents.sort((a, b) => b.time - a.time);
        scoringEvents = scoringEvents.slice(0, MAX_EVENTS);
      } catch (error) {
        console.warn('Spielernamen konnten nicht geladen werden:', error);
        // Die Matchup-Anzeige bleibt unabhängig davon funktionsfähig.
      }
    }

    scoringEvents = scoringEvents.filter(
      event => now - event.time < EVENT_LIFETIME_MS
    );

    renderScoring();
  }

  function renderScoring() {
    const list = $('scoringList');
    if (!list) return;

    const now = Date.now();

    scoringEvents = scoringEvents.filter(
      event => now - event.time < EVENT_LIFETIME_MS
    );

    if (!scoringEvents.length) {
      list.innerHTML = `
        <div class="no-events">
          Noch keine neuen Punkte erkannt.<br>
          Neue Punktesteigerungen erscheinen hier.
        </div>
      `;
      return;
    }

    list.innerHTML = scoringEvents.slice(0, MAX_EVENTS).map(event => `
      <div class="score-event">
        <div>
          <div class="event-name">${esc(event.name)}</div>
          <div class="event-meta">
            ${esc(event.nflTeam)}${event.position
              ? ' · ' + esc(event.position) : ''}
          </div>
        </div>
        <div class="event-points">
          <div class="event-delta">+${fmt(event.delta)}</div>
          <div class="event-total">${fmt(event.total)} Pkt.</div>
        </div>
      </div>
    `).join('');
  }

  async function refresh() {
    if (refreshing) return;
    refreshing = true;

    try {
      const [league, state, users, rosters] = await Promise.all([
        get('/league/' + LEAGUE_ID),
        get('/state/nfl'),
        get('/league/' + LEAGUE_ID + '/users'),
        get('/league/' + LEAGUE_ID + '/rosters')
      ]);

      if (!league) throw new Error('Liga nicht gefunden.');

      const week = Number(state.display_week || state.week || 1);
      const matches = await get(
        '/league/' + LEAGUE_ID + '/matchups/' + week
      );

      const userById = Object.fromEntries(
        users.map(user => [user.user_id, user])
      );

      const names = {};

      for (const roster of rosters) {
        const user = userById[roster.owner_id];
        names[roster.roster_id] = managerName(user);
      }

      const safeMatches = Array.isArray(matches) ? matches : [];

      // Die Matchups werden zuerst dargestellt. Ein Fehler beim
      // Live-Scoring darf sie nicht ausblenden.
      renderMatchups(safeMatches, names, week, league);

      $('updated').textContent = 'Aktualisiert: ' +
        new Date().toLocaleTimeString('de-DE', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });

      $('status').textContent =
        'Verbunden · Aktualisierung alle 5 Sekunden';
      $('status').classList.remove('error');

      try {
        await updateScoring(safeMatches, names);
      } catch (error) {
        console.warn('Live-Scoring konnte nicht aktualisiert werden:', error);
        const list = $('scoringList');

        if (list && !scoringEvents.length) {
          list.innerHTML = `
            <div class="no-events">
              Live-Scoring derzeit nicht verfügbar.<br>
              Die Matchups werden weiter aktualisiert.
            </div>
          `;
        }
      }
    } catch (error) {
      console.error('Aktualisierung fehlgeschlagen:', error);

      $('updated').textContent = 'Aktualisierung fehlgeschlagen';
      $('status').textContent =
        error.message + ' · Internetverbindung prüfen.';
      $('status').classList.add('error');

      // Bereits angezeigte Ergebnisse bleiben stehen, wenn ein
      // späterer Abruf vorübergehend fehlschlägt.
      if (!$('matchups').children.length) {
        $('matchups').innerHTML = `
          <div class="empty">
            Sleeper-Daten konnten nicht geladen werden.
          </div>
        `;
      }
    } finally {
      refreshing = false;
    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
})();
</script>
</body>
</html>
